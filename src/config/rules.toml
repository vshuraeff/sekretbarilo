# generic fallbacks: generic-high-entropy-value is the only heuristic rule and is
# off by default; generic-api-key is contextual
# assignment or standalone token patterns + high entropy

[[rules]]
id = "generic-high-entropy-value"
class = "heuristic"
description = "High-entropy ASCII token in an assignment or on a bare line"
# an unquoted identifier followed by : or = introduces an assignment, even without whitespace.
# whole-line scheme:// values and quoted standalone literals precede assignment matching.
# assignment captures exclude keys and paired square-bracket wrappers; quoted brackets are data.
# the unquoted bare fallback excludes colons and admits equals signs only as trailing padding.
# env-style unquoted values treat internal ", ', and ` bytes literally after a non-quote first byte.
# src/scanner/engine.rs::is_env_style_assignment applies the line-start/export and no-`(` gate.
# trailing , ; ) ] } > & delimit syntax; whitespace and end of line end unquoted values.
# a comma or semicolon also separates a following syntactic key assignment.
# a string prefix (python r b u f t, c/c++ L u U u8 and their R raw forms), a swift raw string
# `#"..."#` and a shell `&&` list operator stay inside the unquoted value here, the reading a shell
# gives them; engine.rs::read_unquoted_value narrows that value to the quoted body or cuts it
# before `&&` only where the surface and the bytes around it prove that reading.
# capture whole values before applying the byte-length and whitespace checks.
# consume complete references; evaluate `:-` and `:=` default operands on their own.
# engine.rs applies an exemption layer (import, markdown, path, pin, url, syntax, word-structure) scoped to this rule id and switchable by [settings] exemption_layer.
# exact 32/40/64-hex assignment values bypass the Shannon gate under the key-token exclusion in hash_detect.rs.
regex = '''(?mx)
  (?:
    (?:\b[A-Za-z_][A-Za-z0-9_.-]*|"(?:\\[^\r\n]|[^"\\\r\n])+"|'(?:\\[^\r\n]|''|[^'\\\r\n])+')
    [\t\x20]*[=:][\t\x20]*
  )?
  (?P<entropy_reference>
    \$\{\{[\t\x20]*[A-Za-z_.][^}\r\n]*\}\}
    | \$\{[A-Za-z_]\w*(?::(?:[-=](?P<entropy_default>[^}\r\n]*)|[+?][^}\r\n]*))?\}
    | \$\{(?:var|data|local|module)\.\w[\w.]*\}|\$!\{[\w.]+\}
    | \{\{\{[\t\x20]*[\w.]+[\t\x20]*\}\}\}
    | \{\{-?[\t\x20]*[A-Za-z_.][^}\r\n]*\}\}
    | \#\{[\w.]+\}|%\{[^}\r\n]+\}
    | <%[=-]?[\t\x20]*[A-Za-z_$@][^%\r\n]*-?%>
    | <\?=[\t\x20]*\$\w[^?\r\n]*\?>
  )
  | ^[\t\x20]*(?:
    "(?P<entropy_bare_double>[\x21-\x7e&&[^"'`=]]+={0,2}|[A-Za-z][A-Za-z0-9+.-]*://[\x21-\x7e&&[^"'`]]+)"
    | '(?P<entropy_bare_single>[\x21-\x7e&&[^"'`=]]+={0,2}|[A-Za-z][A-Za-z0-9+.-]*://[\x21-\x7e&&[^"'`]]+)'
  )[\t\x20]*,?[\t\x20]*\r?$
  | ^[\t\x20]*(?P<entropy_url>[A-Za-z][A-Za-z0-9+.-]*://[\x21-\x7e&&[^"'`]]+)[\t\x20]*\r?$
  | (?P<entropy_key>
    \b[A-Za-z_][A-Za-z0-9_.-]*
    | "(?:\\[^\r\n]|[^"\\\r\n])+"
    | '(?:\\[^\r\n]|''|[^'\\\r\n])+'
  )[\t\x20]*[=:][\t\x20]*(?:
    "(?P<entropy_double>(?:\\[^\r\n]|[^"\\\r\n])*)"
    | '(?P<entropy_single>(?:\\[^\r\n]|''|[^'\\\r\n])*\\?)'
    | \[(?P<entropy_bracket>(?:\\[^\r\n]|[^\s"'`\\\]])+)\]
    | (?P<entropy_unquoted>=*(?:\\[^\r\n]|[^\s"'`\\=]|\\$)(?:\\[^\r\n]|[^\s\\]|\\$)*?)
      (?:
        [,;][\t\x20]*(?:\b[A-Za-z_][A-Za-z0-9_.-]*|"(?:\\[^\r\n]|[^"\\\r\n])+"|'(?:\\[^\r\n]|''|[^'\\\r\n])+')[\t\x20]*[=:]
        | [,;)\]}>&]*(?:[\t\x20\r\n]|$)
      )
  )
  | ^[\t\x20]*(?P<entropy_bare>[\x21-\x7e&&[^"'`=:]]+={0,2})[\t\x20]*\r?$
'''
secret_group = 2
secret_groups = [1, 3, 4, 5, 7, 8, 9, 10, 11]
keywords = []
entropy_threshold = 4.0

[[rules]]
id = "generic-api-key"
class = "contextual"
description = "Generic API key assignment"
# quoted and unquoted alternatives as in generic-secret-assignment.
regex = '''(?i)(?x)
(?:api[-_]?key|apikey|api[-_]?token)["'`]?\]?\s*(?::=|[=:])\s*['"]([^'"]{16,})['"]
|(?m:
  (?:
    (?:^|[\x00\t\x20;&|(",])
    _*(?:(?:[A-Za-z0-9]+[-_])*api[-_]?(?:key|token)|(?-i:(?:[A-Za-z0-9][A-Za-z0-9_-]*)?[a-z0-9]A)pi[-_]?(?:key|token))
    [\t\x20]*(?::=|=)[\t\x20]*
  | ^[\t\x20]*(?:-[\t\x20]+)?
    _*(?:(?:[A-Za-z0-9]+[-_])*api[-_]?(?:key|token)|(?-i:(?:[A-Za-z0-9][A-Za-z0-9_-]*)?[a-z0-9]A)pi[-_]?(?:key|token))
    [\t\x20]*:[\t\x20]+
  | ^[\t\x20]*ENV[\t\x20]+
    _*(?:(?:[A-Za-z0-9]+[-_])*api[-_]?(?:key|token)|(?-i:(?:[A-Za-z0-9][A-Za-z0-9_-]*)?[a-z0-9]A)pi[-_]?(?:key|token))
    [\t\x20]+
  )
  (?P<context_unquoted>[\x21-\x7e&&[^"'`(=]][\x21-\x7e&&[^"'`(]]{15,})
)'''
secret_group = 1
secret_groups = [2]
keywords = ["api_key", "apikey", "api-key", "api_token", "apitoken", "api-token"]
entropy_threshold = 4.0

