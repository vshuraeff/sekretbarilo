# default detection rules for sekretbarilo
# every rule declares its class: signature (a recognizable credential format),
# contextual (a credential key, auth header or credential url) or heuristic
# (value shape and entropy alone). classes and single rules are switched with
# [settings.rule_classes] and [settings.rules]; heuristic is off by default.

# provider formats (signature; contextual where the format needs a named key)
# these tokens have distinctive prefixes that make them highly reliable

[[rules]]
id = "aws-access-key-id"
class = "signature"
description = "AWS access key ID"
regex = "(?:%[0-9A-Fa-f]{2}|\\[[0-9;:]*[mK]|\\\\(?:u\\{[0-9A-Fa-f]{1,6}\\}|u[0-9A-Fa-f]{4}|U[0-9A-Fa-f]{8}|x[0-9A-Fa-f]{2}|[0-7]{1,3}|[A-Za-z])|(?-u:\\b))(AKIA[A-Z0-9]{16})"
secret_group = 1
keywords = ["akia"]

[rules.allowlist]
regexes = ["AKIAIOSFODNN7EXAMPLE"]

[[rules]]
id = "github-personal-access-token"
class = "signature"
description = "GitHub personal access token"
regex = "(?:%[0-9A-Fa-f]{2}|\\[[0-9;:]*[mK]|\\\\(?:u\\{[0-9A-Fa-f]{1,6}\\}|u[0-9A-Fa-f]{4}|U[0-9A-Fa-f]{8}|x[0-9A-Fa-f]{2}|[0-7]{1,3}|[A-Za-z])|(?-u:\\b))(ghp_[0-9a-zA-Z]{36,})"
secret_group = 1
keywords = ["ghp_"]

