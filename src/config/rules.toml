# ============================================================================
# generic credential assignments (contextual) and public-key blocks (signature)
# ============================================================================

[[rules]]
id = "generic-token-assignment"
class = "contextual"
description = "Generic token assignment"
# quoted and unquoted alternatives as in generic-secret-assignment; both read a bare `token`
# key, and the unquoted one reads names ending in it (`GITHUB_TOKEN`, `HF_TOKEN`, `accessToken`).
# the prefilter keyword is `token`.
regex = '''(?i)(?x)
(?:auth_token|access_token|secret_token|token)["'`]?\]?\s*(?::=|[=:])\s*['"]([^'"]{16,})['"]
|(?m:
  (?:
    (?:^|[\x00\t\x20;&|(",])
    _*(?:(?:[A-Za-z0-9]+[-_])*(?:auth|access|secret|github)?token|(?-i:(?:[A-Za-z0-9][A-Za-z0-9_-]*)?[a-z0-9]T)oken)
    [\t\x20]*(?::=|=)[\t\x20]*
  | ^[\t\x20]*(?:-[\t\x20]+)?
    _*(?:(?:[A-Za-z0-9]+[-_])*(?:auth|access|secret|github)?token|(?-i:(?:[A-Za-z0-9][A-Za-z0-9_-]*)?[a-z0-9]T)oken)
    [\t\x20]*:[\t\x20]+
  | ^[\t\x20]*ENV[\t\x20]+
    _*(?:(?:[A-Za-z0-9]+[-_])*(?:auth|access|secret|github)?token|(?-i:(?:[A-Za-z0-9][A-Za-z0-9_-]*)?[a-z0-9]T)oken)
    [\t\x20]+
  )
  (?P<context_unquoted>[\x21-\x7e&&[^"'`(=]][\x21-\x7e&&[^"'`(]]{15,})
)'''
secret_group = 1
secret_groups = [2]
keywords = ["token"]
entropy_threshold = 4.0

# ============================================================================
# public key detection (only active when detect_public_keys = true)
# ============================================================================

[[rules]]
id = "pem-public-key"
class = "signature"
description = "PEM public key"
regex = "(-----BEGIN[A-Z ]*PUBLIC KEY-----)"
secret_group = 1
keywords = ["-----begin", "public key"]

[[rules]]
id = "pgp-public-key-block"
class = "signature"
description = "PGP public key block"
regex = "(-----BEGIN PGP PUBLIC KEY BLOCK-----)"
secret_group = 1
keywords = ["-----begin pgp", "public key block"]

[[rules]]
id = "openssh-public-key"
class = "signature"
description = "OpenSSH public key"
regex = "((?:ssh-(?:rsa|ed25519|dss)|ecdsa-sha2-nistp(?:256|384|521)|sk-(?:ssh-ed25519|ecdsa-sha2-nistp256)@openssh\\.com)\\s+AAAA[A-Za-z0-9+/=]{20,})"
secret_group = 1
keywords = ["ssh-rsa", "ssh-ed25519", "ssh-dss", "ecdsa-sha2-nistp", "sk-ssh-ed25519", "sk-ecdsa-sha2"]
