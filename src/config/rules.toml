# credential context (contextual)
# these need keyword context and/or entropy checks

[[rules]]
id = "aws-secret-access-key"
class = "contextual"
description = "AWS secret access key"
regex = "(?i)(?:aws_secret_access_key|aws_secret|secret_access_key)\\s*[=:]\\s*['\"]?([A-Za-z0-9/+=]{40})['\"]?"
secret_group = 1
keywords = ["aws_secret", "secret_access_key"]
entropy_threshold = 3.5

[[rules]]
id = "database-connection-string-postgres"
class = "contextual"
description = "PostgreSQL connection string with credentials"
regex = "postgres(?:ql)?://[^:/?#\\s]+:([^@\\s'\"]{6,})@[^\\s'\"]+"
secret_group = 1
keywords = ["postgres://", "postgresql://"]

[[rules]]
id = "database-connection-string-mysql"
class = "contextual"
description = "MySQL connection string with credentials"
regex = "mysql://[^:/?#\\s]+:([^@\\s'\"]{6,})@[^\\s'\"]+"
secret_group = 1
keywords = ["mysql://"]

[[rules]]
id = "database-connection-string-mongodb"
class = "contextual"
description = "MongoDB connection string with credentials"
regex = "mongodb(?:\\+srv)?://[^:/?#\\s]+:([^@\\s'\"]{6,})@[^\\s'\"]+"
secret_group = 1
keywords = ["mongodb://", "mongodb+srv://"]

[[rules]]
id = "redis-connection-string"
class = "contextual"
description = "Redis connection string with password"
regex = "redis://:([^@\\s'\"]{6,})@[^\\s'\"]+"
secret_group = 1
keywords = ["redis://"]

[[rules]]
id = "generic-password-assignment"
class = "contextual"
description = "Quoted or unquoted password assignment in code and configuration"
# alternative captures keep matching quote pairs and preserve surrounding syntax.
regex = '''(?ix)
(?P<password_key>[A-Za-z0-9_.-]*(?:password|passwd|pwd))["'`]?\]?[\t\x20]*[=:][\t\x20]*
(?:
  "((?:\\[^\r\n]|[^"\\\r\n]){8,})"
  | '(?P<password_single>(?:\\[^\r\n]|''|[^'\\\r\n]){8,}\\?)'
  | `(?P<password_backtick>(?:\\[^\r\n]|[^`\\\r\n]){8,}\\?)`
  | (?P<password_unquoted>(?:\\[^\r\n]|[^\s"'`,;\#()\[\]{}<>\\])(?:\\[^\r\n]|[^\s"'`,;()\[\]{}<>\\]){7,}\\?)
)
'''
secret_group = 2
secret_groups = [3, 4, 5]
keywords = ["password", "passwd", "pwd"]
# note: password rules use the password strength heuristic instead of entropy

[[rules]]
id = "generic-secret-assignment"
class = "contextual"
description = "Secret assignment in code and configuration"
# the quoted alternative reads quoted json/dict keys too. the unquoted alternative (group context_unquoted) reads a
# credential-named assignment wherever one can start: `NAME=value` (optional horizontal spacing
# around `=`) after line start, a space or tab (`export`, `env`, `sudo`, `docker run -e`, a yaml
# `- ` item) or a shell `;` `&` `|` `(`, a quote, comma or nul, and yaml `name: value` (whitespace after the colon) only
# at logical line start or after a yaml `- `. the name, after optional leading `_`, is the key
# word alone or the key word ending a longer name: snake or kebab words before it
# (`DJANGO_SECRET_KEY`) or a camel hump (`jwtSecret`), never a name that continues past it
# (`secret_name`) or glues it to a lowercase word (`xsecret`); a `.` before the name (member
# access), a `-` (a flag) or another byte outside the start set is no assignment start. the value
# is the whole run of printable ascii and never starts with `=` (`==`); engine.rs rejects a run
# that does not end its word at whitespace or end of input, so a quote, backtick or `(` in the
# word rejects the arm instead of cutting the value short, and drops a word that is a path, is
# rooted at a variable reference or reads as code or words (`is_source_expression_value`). the
# pattern keeps its leading `(?i)`, which marks the rule context dependent; `(?x)` ignores the
# layout whitespace.
regex = '''(?i)(?x)
(?:secret|secret[-_]?key(?:[-_]?base)?|(?:api|client)[-_]?secret)["'`]?\]?\s*(?::=|[=:])\s*['"]([^'"]{8,})['"]
|(?m:
  (?:
    (?:^|[\x00\t\x20;&|(",])
    _*(?:(?:[A-Za-z0-9]+[-_])*(?:api|client)?secret(?:[-_]?key(?:[-_]?base)?)?|(?-i:(?:[A-Za-z0-9][A-Za-z0-9_-]*)?[a-z0-9]S)ecret(?:[-_]?key(?:[-_]?base)?)?)
    [\t\x20]*(?::=|=)[\t\x20]*
  | ^[\t\x20]*(?:-[\t\x20]+)?
    _*(?:(?:[A-Za-z0-9]+[-_])*(?:api|client)?secret(?:[-_]?key(?:[-_]?base)?)?|(?-i:(?:[A-Za-z0-9][A-Za-z0-9_-]*)?[a-z0-9]S)ecret(?:[-_]?key(?:[-_]?base)?)?)
    [\t\x20]*:[\t\x20]+
  | ^[\t\x20]*ENV[\t\x20]+
    _*(?:(?:[A-Za-z0-9]+[-_])*(?:api|client)?secret(?:[-_]?key(?:[-_]?base)?)?|(?-i:(?:[A-Za-z0-9][A-Za-z0-9_-]*)?[a-z0-9]S)ecret(?:[-_]?key(?:[-_]?base)?)?)
    [\t\x20]+
  )
  (?P<context_unquoted>[\x21-\x7e&&[^"'`(=]][\x21-\x7e&&[^"'`(]]{7,})
)'''
secret_group = 1
secret_groups = [2]
keywords = ["secret", "secret_key", "api_secret"]
entropy_threshold = 3.5

[[rules]]
id = "password-in-url"
class = "contextual"
description = "Password embedded in URL"
regex = "(?i)://[^:/?#\\s]+:([^@/?#\\s]+)@[^\\s'\"]+"
secret_group = 1
keywords = ["://"]

[[rules]]
id = "http-bearer-token"
class = "contextual"
description = "HTTP bearer token"
regex = "(?i)(?:bearer|authorization)\\s+(?:bearer\\s+)?([a-zA-Z0-9_\\-\\.]{20,})"
secret_group = 1
keywords = ["bearer", "authorization"]
entropy_threshold = 3.5

[[rules]]
id = "http-basic-auth"
class = "contextual"
description = "HTTP basic auth header"
regex = "(?i)(?:basic|authorization)\\s+(?:basic\\s+)?([A-Za-z0-9+/]{20,}={0,2})"
secret_group = 1
keywords = ["basic", "authorization"]
entropy_threshold = 3.0

[[rules]]
id = "webhook-url-with-token"
